{% extends 'global/Page.html' %}

{% block title %}

    <div class="d-flex justify-content-center" style="margin-top: -50px">
        <h2 style="margin-bottom:20px">INTERVIEW</h2>
    </div>

{% endblock %}

{% block content %}
    <style>
        #fss tr:nth-child(even) {background-color: #f9f9f9;}
        #dcd tr:nth-child(even) {background-color: #f9f9f9;}
        #aut tr:nth-child(even) {background-color: #f9f9f9;}
        th {
            text-align:center;
            width: 5%;
        }
        input[type="radio"]{margin-left:-5.5px}

        input[type="range"] {
            -webkit-appearance: slider-horizontal;
            max-width: 85%;
            display: inline;
            margin-left: 2%;
            margin-right: 2%;
        }
    </style>

    <div class="jumbotron">
        <p>
            Please reflect on your <b style="color: darkcyan">flow experience</b> during the tasks.
        </p>
        {{ formfield 'qual_indiv_q1_general' }}
        {{ formfield 'qual_indiv_q2_moment' }}
    </div>

    <div class="d-flex justify-content-center">
        <button class="otree-btn-next btn btn-primary next-button otree-next-button">Next</button>
    </div>

<script>
    // For better UX: Select radio button when clicking into a table cell
    $('td').click(function() {
        $(this).find('input:radio').prop('checked', true);
    })

    // Resize the textareas
    for (let ele of document.getElementsByTagName('textarea')) {
        ele.rows = 10;
    }
</script>

{% endblock %}
